name: Actualizar tasas +58 P2P

on:
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos, 24/7
  workflow_dispatch: {}       # también se puede correr manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar DolarApi, Binance P2P y guardar en Firebase
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          set -e
          OFICIAL=$(curl -s https://ve.dolarapi.com/v1/dolares/oficial | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('promedio') or d.get('venta') or d.get('compra'))")
          PARALELO=$(curl -s https://ve.dolarapi.com/v1/dolares/paralelo | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('promedio') or d.get('venta') or d.get('compra'))")
          COMPRA=$(python3 -c "print(round(float('$OFICIAL')*1.005,2))")
          VENTA=$(python3 -c "print(round(float('$PARALELO'),2))")
          OFICIAL_FMT=$(python3 -c "print(round(float('$OFICIAL'),2))")
          FECHA=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          echo "Compra: $COMPRA | Venta (paralelo, en uso): $VENTA | Oficial: $OFICIAL_FMT"

          # --- PRUEBA: Binance P2P directo (servidor, sin bloqueo de CORS) ---
          # Todavía NO se usa en el tablero — se guarda aparte para comparar primero.
          BINANCE_RAW_SELL=$(curl -s -X POST "https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search" \
            -H "Content-Type: application/json" \
            -d '{"asset":"USDT","fiat":"VES","tradeType":"SELL","page":1,"rows":5,"payTypes":[]}' || echo '{}')
          BINANCE_RAW_BUY=$(curl -s -X POST "https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search" \
            -H "Content-Type: application/json" \
            -d '{"asset":"USDT","fiat":"VES","tradeType":"BUY","page":1,"rows":5,"payTypes":[]}' || echo '{}')

          echo "Respuesta Binance (SELL, primeras 300 letras): ${BINANCE_RAW_SELL:0:300}"
          echo "Respuesta Binance (BUY, primeras 300 letras): ${BINANCE_RAW_BUY:0:300}"

          BINANCE_SELL_MEDIANA=$(echo "$BINANCE_RAW_SELL" | python3 -c "import sys,json;d=json.load(sys.stdin);p=sorted(float(x['adv']['price']) for x in d.get('data',[]));print(p[len(p)//2] if p else '')" 2>/dev/null || echo '')
          BINANCE_BUY_MEDIANA=$(echo "$BINANCE_RAW_BUY" | python3 -c "import sys,json;d=json.load(sys.stdin);p=sorted(float(x['adv']['price']) for x in d.get('data',[]));print(p[len(p)//2] if p else '')" 2>/dev/null || echo '')
          echo "Binance SELL mediana: $BINANCE_SELL_MEDIANA | Binance BUY mediana: $BINANCE_BUY_MEDIANA"

          # Actualiza la tasa vigente (nodo único que lee el portal) — venta sigue usando DolarApi por ahora
          curl -s -X PUT \
            -H "Content-Type: application/json" \
            -d "{\"compra\":\"$COMPRA\",\"venta\":\"$VENTA\",\"oficial\":\"$OFICIAL_FMT\",\"fecha\":\"$FECHA\",\"auto\":true,\"binance_sell_debug\":\"$BINANCE_SELL_MEDIANA\",\"binance_buy_debug\":\"$BINANCE_BUY_MEDIANA\"}" \
            "$FIREBASE_DB_URL/p58p2p-tasa.json"

          # Agrega un punto al historial (clave autogenerada, no se pisa con otros escritores)
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"compra\":\"$COMPRA\",\"venta\":\"$VENTA\",\"fecha\":\"$FECHA\"}" \
            "$FIREBASE_DB_URL/p58p2p-historial-cron.json"
